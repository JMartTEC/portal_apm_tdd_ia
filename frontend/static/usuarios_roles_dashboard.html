<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios y Roles · TEC</title>
<style>
  :root { --azul: #003da5; --azul-osc: #002a72; --tinta: #14213d; --gris: #5b6478; --fondo: #f4f7fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--tinta); background: var(--fondo); }
  header { background: linear-gradient(135deg, var(--azul-osc), var(--azul)); color: #fff; padding: 28px 24px; }
  .marca { display: flex; align-items: center; gap: 16px; max-width: 900px; margin: 0 auto; }
  .marca-tec { font-weight: 800; font-size: 18px; border: 2px solid #fff; border-radius: 10px; padding: 6px 12px; }
  h1 { margin: 0; font-size: 22px; }
  main { max-width: 900px; margin: 40px auto; padding: 0 24px; }
  .aviso { background: #fff; border: 1px solid #d7dee9; border-radius: 10px; padding: 28px; }
  a.volver { color: var(--azul); font-weight: 600; text-decoration: none; }
  a.volver:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="marca">
    <span class="marca-tec">TEC</span>
    <h1>Usuarios y Roles</h1>
  </div>
</header>
<main>
  <div class="aviso">
    <p>Esta sección no está disponible en este despliegue.</p>
    <p><a class="volver" href="/">&larr; Volver al portal</a></p>
  </div>
</main>
</body>
</html>
